# Let PipeWire do volume in software; never drive the firmware's hardware
# volume, which is nearly inaudible below ~65%.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-Razer_Razer_Leviathan_V2_X*" } ]
    actions = { update-props = { api.alsa.soft-mixer = true } }
  }
]
